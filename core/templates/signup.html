<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beauty Blend - Sign Up</title>

    <link rel="stylesheet" href="{% static 'signup.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <h1>Beauty Blend</h1>

    <h2>Create Your Account</h2>

    <!-- Full Name -->
    <input
        type="text"
        id="fullname"
        placeholder="Enter Full Name"
        maxlength="50"
        required>


    <!-- Email -->
    <input
        type="email"
        id="email"
        placeholder="Enter Email"
        required>


    <!-- Phone Number -->
    <input
        type="tel"
        id="phone"
        placeholder="Enter Phone Number"
        maxlength="10"
        inputmode="numeric"
        required>


    <!-- Password -->
    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Enter Password (Minimum 8 Characters)"
            minlength="8"
            required>

        <span id="eye1" onclick="togglePassword()">
            <i class="fa-solid fa-eye-slash"></i>
        </span>

    </div>


    <!-- Confirm Password -->
    <div class="password-box">

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            minlength="8"
            required>

        <span id="eye2" onclick="toggleConfirmPassword()">
            <i class="fa-solid fa-eye-slash"></i>
        </span>

    </div>


    <!-- Forgot Password -->
    <div class="forgot-password">

        <a href="#">
            Forgot Password?
        </a>

    </div>


    <!-- Register -->
    <button type="button" onclick="register()">
        Register
    </button>


    <!-- Login -->
    <p>

        Already have an account?

        <a href="{% url 'login_page' %}">
            Login
        </a>

    </p>

</div>


<script src="{% static 'signup.js' %}"></script>

</body>
</html>
