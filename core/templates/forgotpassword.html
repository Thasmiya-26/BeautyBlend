<!DOCTYPE html>
<html lang="en">

{% load static %}

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Beauty Blend - Forgot Password</title>

    <link rel="stylesheet"
          href="{% static 'forgotpassword.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <h1>Beauty Blend</h1>

    <h2>Reset Password</h2>

    <!-- Email -->
    <input
        type="email"
        id="email"
        placeholder="Enter Your Registered Email"
        autocomplete="email"
        required>


    <!-- New Password -->
    <div class="password-box">

        <input
            type="password"
            id="newPassword"
            placeholder="New Password (Minimum 8 Characters)"
            autocomplete="new-password"
            minlength="8"
            required>

        <span onclick="toggleNewPassword()">

            <i id="eye1"
               class="fa-solid fa-eye-slash">
            </i>

        </span>

    </div>


    <!-- Confirm Password -->
    <div class="password-box">

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            autocomplete="new-password"
            minlength="8"
            required>

        <span onclick="toggleConfirmPassword()">

            <i id="eye2"
               class="fa-solid fa-eye-slash">
            </i>

        </span>

    </div>


    <!-- Reset Button -->
    <button
        type="button"
        onclick="resetPassword()">

        Reset Password

    </button>


    <p id="message"></p>


    <!-- Back to Login -->
    <p>

        <a href="{% url 'login_page' %}">
            Back to Login
        </a>

    </p>

</div>


<script src="{% static 'forgotpassword.js' %}"></script>

</body>

</html>
